<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#14211f;--mut:#6b7a77;--line:#dbe3e0;--acc:#0f766e;--hero:#14211f;--heroT:#f6c453;--bad:#b4402c}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17221f;--ink:#e8f0ee;--mut:#8fa09c;--line:#26352f;--acc:#3dbdaf;--hero:#e8f0ee;--heroT:#9a5b00}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px 14px 210px;max-width:640px;width:100%;margin:0 auto}
h2{font-size:13px;color:var(--mut);font-weight:600;margin:20px 2px 6px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row .t{flex:1;min-width:0}.row .ti{overflow-wrap:anywhere}.row small{color:var(--mut)}
.tm{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut);min-width:46px;font-size:14px}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);flex:none;padding:0}
.done .ck{background:var(--acc);border-color:var(--acc)}.done .ti{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;font-size:12px;color:var(--acc);margin-right:6px}
.mv{color:var(--mut);font-size:20px;line-height:1}
.hero{background:var(--hero);color:var(--bg);border-radius:14px;padding:12px;margin:8px 0 4px}
.hero .big{font-size:30px;font-weight:700;color:var(--heroT);font-variant-numeric:tabular-nums;line-height:1}
.hero .ti{font-size:15px;margin:4px 0 8px;overflow-wrap:anywhere}
.hero button{background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;margin-right:6px;font-size:14px;font-weight:600}
.hero button.g{background:none;color:var(--bg);border:1px solid #8886}
.date{display:flex;align-items:center;justify-content:space-between}
.date b{font-size:22px}.date button{font-size:22px;color:var(--mut)}
.od{border-color:var(--bad)}.od small{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:56px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line)}
.bar div{max-width:640px;margin:auto;display:flex;gap:8px}
.bar input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px}
.bar button{background:var(--acc);color:#fff;border-radius:12px;padding:0 16px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;color:var(--mut);font-weight:600}nav .on{color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:640px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:92%;overflow:auto}
.sheet label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.sheet input,.sheet textarea,.sheet select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}
.sheet .two{display:flex;gap:8px}.sheet .two>*{flex:1}
.pri{background:var(--acc);color:#fff;border-radius:10px;padding:12px 18px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:14px 6px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:10;white-space:nowrap}
#toast button{color:var(--heroT);font-weight:700;padding:0 0 0 10px}
.bd{height:10px;border-radius:5px;background:var(--acc);margin-top:4px}
.empty{color:var(--mut);padding:18px 4px}
button{transition:transform .1s}button:active{transform:scale(.95)}
#sy{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:11;opacity:0;transition:opacity .25s;pointer-events:none}
#sy.on{opacity:1}#sy.bad{background:var(--bad);color:#fff}
.sk{height:56px;border-radius:12px;margin-bottom:8px;background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}.ck.pop{animation:pop .35s}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 2px}.prog i{display:block;height:100%;background:var(--acc)}
.pg{color:var(--mut);display:block;text-align:center;font-size:13px}.gr{color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chip.nudge{background:none;border-style:dashed;color:var(--mut)}
.dn{margin-bottom:8px}.dn button{flex:none;min-width:52px;height:42px;font-size:24px;line-height:1;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}.dn .dl{flex:1;font-size:15px;font-weight:600}
.date{justify-content:center}
h2.flex{display:flex;justify-content:space-between;align-items:center}
h2.col{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;padding:6px 2px;margin-top:14px}
h2.col .cv{font-size:14px;width:22px;text-align:center}
.row .ti,.hero .ti{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.hero .ti{-webkit-line-clamp:3}
.sheet textarea{font:inherit}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--card);padding:10px 0;margin:-16px 0 0;z-index:2}
.top b{flex:1;font-size:18px}.top small{color:var(--mut)}.top .pri{padding:8px 18px}
.top .bk{font-size:30px;line-height:1;padding:0 10px 4px 2px;color:var(--ink)}
.th{position:relative;display:inline-block}.th:has(img.big){display:block;width:100%}
.th img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.th img.big{width:100%;height:auto;max-height:70vh;object-fit:contain}
.th button{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--bg);border-radius:50%;width:22px;height:22px;padding:0;font-size:12px}
.timer{font-size:40px;font-variant-numeric:tabular-nums;text-align:center;margin:10px 0}
input[type=checkbox]{width:auto}.cb{display:flex;align-items:center;gap:8px;color:var(--ink)!important}
nav button{font-size:12.5px;padding:8px 2px}
/* Plan matrix */
main.wide{max-width:1100px}
.mx{overflow-x:auto;margin:0 -14px;padding:0 14px 8px;-webkit-overflow-scrolling:touch}
.mrow{display:grid;grid-template-columns:70px repeat(14,minmax(58px,1fr));gap:6px;margin-bottom:8px;min-width:980px}
.ml{position:sticky;left:0;z-index:2;background:var(--bg);font-size:12px;font-weight:700;color:var(--mut);padding-top:8px}
.mcell{min-height:76px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
.mcell.today{border:2px solid var(--acc)}.mcell.od{border-color:var(--bad)}
.mcell.dz{outline:2px dashed var(--acc);outline-offset:-2px;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.mh small{font-weight:600;color:var(--acc)}
.mp{padding:0 4px;font-size:16px;color:var(--acc);line-height:1}
.ms{font-size:11px;font-style:italic;color:var(--mut);margin:-2px 0 4px}
.mc{font-size:13px;line-height:1.25;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 7px;margin-bottom:4px;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc b{color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums}
.mc.done{text-decoration:line-through;opacity:.55}.mc.lift{opacity:.3}
.mc[data-fixed]{cursor:pointer}
.mc.ghost{box-shadow:0 8px 24px #0005;background:var(--card);border-color:var(--acc);opacity:.95}

</style></head><body>
<main id="v"></main>
<div class="bar" id="qa"><div id="dn" class="dn"></div><div><input id="q" placeholder="swim tomorrow 6pm #fitness" enterkeyhint="done"><button id="qm" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">⋯</button><button id="qb">Add</button></div></div>
<nav><button data-tab="today" class="on">☀️ Today</button><button data-tab="backlog">🗂 Backlog</button><button data-tab="log">📈 Log</button><button data-tab="plan">🗓 Plan</button><button data-tab="actuals">📝 Actuals</button></nav>
<div id="sy"></div><div id="toast"></div><div id="sh"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>new Date(s+'T00:00:00'),addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d)};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let S={items:[],completions:[],sessions:[],config:{categories:'Meditation,Exercise,Walk'},today:fmt(new Date())},tab='today',day=S.today,cat='',timer=null,range=7,tick,undoFn;

/* ---------- server (queued, optimistic, silent) ---------- */
const hasGS=typeof google!=='undefined'&&google.script&&google.script.run;
let queue=Promise.resolve();
let pend=0,syT,bad=false,loaded=false,HAVE=false;
function saveCache(){if(!loaded)return;try{localStorage.setItem('planner_v1',JSON.stringify({items:S.items,completions:S.completions,sessions:S.sessions,config:S.config,today:S.today}))}catch(e){}}
// Saving is silent now: the UI is already updated (optimistic) and the cache is written immediately.
// The pill only appears when something actually failed to reach the sheet.
function syn(){const e=$('#sy');
  if(pend>0)return;
  saveCache();
  if(!e)return;clearTimeout(syT);
  if(bad){bad=false;e.className='on bad';e.textContent='⚠ Not saved — will retry on reload';syT=setTimeout(()=>{e.className=''},4000)}
  else e.className=''}
function call(fn,args,done,onErr){pend++;saveCache();queue=queue.then(()=>new Promise(r=>{
  const fin=()=>{pend--;syn();r()};
  if(!hasGS){done&&done(null);return fin()}
  google.script.run.withSuccessHandler(x=>{done&&done(x);fin()}).withFailureHandler(e=>{bad=true;if(onErr)onErr(e);else{toast('Sync failed — will retry on reload');done&&done(null)}fin()})[fn](...args())}))}
const uid=()=>'tmp_'+Math.random().toString(36).slice(2,8);
const byId=id=>S.items.find(i=>i.ID===id);
function save(it,msg){ // upsert
  let o=it.ID&&byId(it.ID);const prev=o&&{...o};
  if(o)Object.assign(o,it);else{o={ID:uid(),Status:'Open',Created:nowISO(),...it};S.items.push(o)}
  const ref=o;render();
  call('api_saveItem',()=>{const c={...ref};if(String(c.ID).startsWith('tmp_'))delete c.ID;delete c._row;return[c]},r=>{if(r)Object.assign(ref,r)});
  if(msg)toast(msg,()=>{if(prev){Object.assign(ref,prev);save(prev)}else del(ref.ID,true)})}
function del(id,quiet){S.items=S.items.filter(i=>i.ID!==id);render();call('api_delete',()=>[id])}
function move(id,to){const o=byId(id),prev={...o};
  if(to==='backlog')Object.assign(o,{Type:'Backlog',Date:'',Time:'',Lane:''});
  else if(to&&to.board!==undefined)Object.assign(o,{Type:'Board',Lane:to.board,Date:'',Time:''});
  else Object.assign(o,{Type:'Planned',Date:to==='today'?S.today:to,Lane:''});
  render();call('api_move',()=>[o.ID,to]);
  toast('Moved',()=>{Object.assign(o,prev);render();save(prev)})}
function isDone(i,d){return i.Recurrence?S.completions.some(c=>c.ItemID===i.ID&&c.Date===d):i.Status==='Done'}
function toggle(id,d){const i=byId(id),was=isDone(i,d),v=!was;
  if(i.Recurrence){if(v)S.completions.push({ItemID:id,Date:d,Status:'Done'});else S.completions=S.completions.filter(c=>!(c.ItemID===id&&c.Date===d))}
  else{i.Status=v?'Done':'Open'}
  render();call('api_complete',()=>[i.ID,d,v,!!i.Recurrence]);
  if(v){const e=document.querySelector(`[data-id="${i.ID}"] .ck`);e&&e.classList.add('pop');navigator.vibrate&&navigator.vibrate(15)}
  if(v)toast('Done',()=>toggle(id,d))}
function occurs(i,d){if(i.Type!=='Planned')return false;if(!i.Recurrence)return i.Date===d;
  if(d<i.Date||(i.RecurEnd&&d>i.RecurEnd))return false;
  return i.Recurrence==='daily'||(i.RecurDays||'').split(',').includes(DOW[parseD(d).getDay()])}

/* ---------- quick-add parser ---------- */
function parse(t,base){let tags=[],date=null,time='',rec='',bl=false;
  t=t.replace(/#(\w+)/g,(_,x)=>(tags.push(x),''));
  t=t.replace(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i,(m,h,mi,ap)=>{h=+h%12;if(/p/i.test(ap))h+=12;time=pad(h)+':'+(mi||'00');return ''});
  if(!time)t=t.replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/,(m,h,mi)=>(time=pad(h)+':'+mi,''));
  t=t.replace(/\b(every ?day|daily)\b/i,()=>(rec='daily',''));
  t=t.replace(/\b(later|someday|backlog)\b/i,()=>(bl=true,''));
  t=t.replace(/\b(\d{4}-\d{2}-\d{2})\b/,(m,x)=>(date=x,''));
  t=t.replace(/\bin (\d+) days?\b/i,(m,n)=>(date=addD(S.today,+n),''));
  t=t.replace(/\b(today|tomorrow|tmr)\b/i,(m,w)=>(date=w.toLowerCase()==='today'?S.today:addD(S.today,1),''));
  t=t.replace(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i,(m,w)=>{const k=DOW.findIndex(x=>x.toLowerCase()===w.toLowerCase());let n=(k-new Date().getDay()+7)%7||7;date=addD(S.today,n);return ''});
  const title=t.replace(/\s+/g,' ').trim();
  return{Title:title,Date:bl?'':(date||base),Time:bl?'':time,Tags:tags.join(','),Recurrence:rec,Type:bl?'Backlog':'Planned'}}
function quickAdd(){const v=$('#q').value.trim();if(!v)return;$('#q').value='';
  let txt=v,notes='';if(v.length>90){notes=v;txt=v.slice(0,70).replace(/\s+\S*$/,'')+'…'}
  const p=parse(txt,tab==='backlog'?'':day);if(notes)p.Notes=notes;if(tab==='backlog'){p.Type='Backlog';p.Date='';p.Time=''}
  if(!p.Title)return;save(p,'Added')}

/* ---------- views ---------- */
const tg=i=>(i.Tags||'').split(',').filter(Boolean).map(t=>`<span class="tag">#${E(t)}</span>`).join('');
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function nd(v){v=String(v||'');if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);const m=v.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{4})$/);if(m&&MON[m[2].toLowerCase()])return m[3]+'-'+pad(MON[m[2].toLowerCase()])+'-'+pad(+m[1]);return v}
function cts(v){v=String(v||'');if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.replace(' ','T');const n=nd(v);return /^\d{4}-\d{2}-\d{2}$/.test(n)?n+'T00:00:00':v}
const nowISO=()=>{const d=new Date();return fmt(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
function norm(d){d.items.forEach(i=>{i.Date=nd(i.Date);i.RecurEnd=nd(i.RecurEnd);i.Created=cts(i.Created);i.Completed=cts(i.Completed)});d.completions.forEach(c=>c.Date=nd(c.Date));d.sessions.forEach(x=>x.Date=nd(x.Date));return d}
const dl=d=>(d===S.today?'Today':d===addD(S.today,1)?'Tomorrow':d===addD(S.today,-1)?'Yesterday':DOW[parseD(d).getDay()])+', '+parseD(d).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const ordv=i=>(i.Order===''||i.Order==null||isNaN(Number(i.Order)))?1e9:Number(i.Order);
const byOrd=(a,b)=>ordv(a)-ordv(b)||String(a.Created).localeCompare(String(b.Created));
const sortAny=l=>l.sort((a,b)=>(isDone(a,day)-isDone(b,day))||byOrd(a,b));
function bsorter(){const k=window.bsort||'new',r=x=>x._row||1e9,base=k==='old'?(a,b)=>String(a.Created).localeCompare(String(b.Created))||r(a)-r(b):k==='az'?(a,b)=>a.Title.localeCompare(b.Title):k==='man'?byOrd:(a,b)=>String(b.Created).localeCompare(String(a.Created))||r(b)-r(a);
  return k==='man'?base:(a,b)=>((b.Star==='Y')-(a.Star==='Y'))||base(a,b)}
function groupFor(i){
  if(i.Type==='Backlog')return S.items.filter(x=>x.Type==='Backlog'&&x.Status!=='Done').sort(byOrd);
  if(i.Type==='Board')return S.items.filter(x=>x.Type==='Board'&&x.Lane===i.Lane&&x.Status!=='Done').sort(byOrd);
  return sortAny(S.items.filter(x=>occurs(x,day)&&!x.Time))}
function reorder(id,dir){const i=byId(id);if(!i)return;const g=groupFor(i),k=g.findIndex(x=>x.ID===id);if(k<0)return;
  const t=dir==='up'?k-1:dir==='dwn'?k+1:0;if(t<0||t>=g.length||t===k)return;
  g.splice(k,1);g.splice(t,0,i);g.forEach((x,n)=>x.Order=String(n+1));render();
  const l=[...g];call('api_setOrder',()=>[l.map(x=>[x.ID,x.Order])])}
function delSoft(id){const snap=byId(id);if(!snap)return;S.items=S.items.filter(i=>i!==snap);render();
  const h=setTimeout(()=>call('api_delete',()=>[snap.ID]),5000);
  toast('Deleted',()=>{clearTimeout(h);S.items.push(snap);render()})}
function blRow(i,man){return`<div class="row" data-id="${i.ID}"><button class="ck" data-a="tg"></button><div class="t" data-a="ed"><div class="ti">${E(i.Title)}</div><small>${tg(i)}${i.Image?'📎'+i.Image.split(',').length:''}</small></div><button class="mv" data-a="star" aria-label="Focus">${i.Star==='Y'?'⭐':'☆'}</button>${man?'<button class="mv" data-a="up">▲</button><button class="mv" data-a="dwn">▼</button>':''}<button class="mv" data-a="mv">⋯</button></div>`}
function rowH(i,d,extra='',ro=false){const dn=isDone(i,d);
  return`<div class="row ${dn?'done':''} ${extra}" data-id="${i.ID}"><button class="ck" data-a="tg" aria-label="Complete"></button>
  <span class="tm">${i.Time||''}</span><div class="t" data-a="ed"><div class="ti">${E(i.Title)}${i.Recurrence?' ↻':''}</div><small>${tg(i)}${i.Image?'📎'+i.Image.split(',').length+' ':''}${i.Notes?E(i.Notes.slice(0,40)):''}${extra?'Due '+i.Date:''}</small></div>
  <button class="mv" data-a="star" aria-label="Star">${i.Star==='Y'?'⭐':'☆'}</button>${ro?'<button class="mv" data-a="up">▲</button><button class="mv" data-a="dwn">▼</button>':''}<button class="mv" data-a="mv" aria-label="Move">⋯</button></div>`}
function vToday(){
  const items=S.items.filter(i=>occurs(i,day)),timed=items.filter(i=>i.Time).sort((a,b)=>a.Time.localeCompare(b.Time)),any=sortAny(items.filter(i=>!i.Time));
  const od=day===S.today?S.items.filter(i=>i.Type==='Planned'&&!i.Recurrence&&i.Status!=='Done'&&i.Date<S.today):[];
  const nowT=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  let nx=day===S.today?timed.filter(i=>!isDone(i,day)&&i.Time>=nowT)[0]:null;
  const hr=new Date().getHours(),gr=hr<12?'☀️ Good morning':hr<17?'🌤 Good afternoon':'🌙 Good evening';
  let h=`<div class="date"><div style="text-align:center">${day===S.today?`<span class="gr">${gr}</span><br>`:''}<b data-a="pk">${dl(day)}</b></div></div>`;
  
  if(nx)h+=`<div class="hero" data-id="${nx.ID}"><small style="opacity:.7">Up next ⏰</small><div class="big">${nx.Time}</div><div class="ti">${nx.Star==='Y'?'⭐ ':''}${E(nx.Title)}</div><button data-a="tg">Done</button><button class="g" data-a="sn">Snooze 30 min</button><button class="g" data-a="ed">Edit</button></div>`;

/* collapsed state for Backlog + each Board (remembered on this device) */
let COL={};try{COL=JSON.parse(localStorage.getItem('planner_col')||'{}')||{}}catch(e){}
function vBacklog(){const q=(window.bq||'').toLowerCase(),sk=window.bsort||'new',man=sk==='man',srt=bsorter();
  const m=i=>!q||(i.Title+i.Tags+i.Notes+i.Lane).toLowerCase().includes(q);
  const sf=i=>!window.bstar||i.Star==='Y';

  const hd=(k,label,n)=>`<h2 class="flex col" data-a="col" data-k="${E(k)}"><span>${label} (${n})</span><span class="cv">${isCol(k)?'▸':'▾'}</span></h2>`;
  const bl=S.items.filter(i=>i.Type==='Backlog'&&i.Status!=='Done'&&m(i)&&sf(i)).sort(srt),bd=S.items.filter(i=>i.Type==='Board'&&i.Status!=='Done'&&m(i)&&sf(i)).sort(srt);
  let h=`<h2>Search</h2><input id="bs" class="row" style="width:100%" placeholder="Search title, tag, notes" value="${E(window.bq||'')}">`;

  h+=hd('bl','Backlog',bl.length);
  if(!isCol('bl'))h+=(bl.map(i=>blRow(i,man)).join('')||'<div class="empty">Empty. Type above to park something for later.</div>');
  const L={};bd.forEach(i=>(L[i.Lane||'Board']=L[i.Lane||'Board']||[]).push(i));
  Object.keys(L).sort().forEach(l=>{const k='b:'+l;h+=hd(k,'Board: '+E(l),L[l].length);if(!isCol(k))h+=L[l].map(i=>blRow(i,man)).join('')});
  const up=S.items.filter(i=>i.Type==='Planned'&&!i.Recurrence&&i.Status!=='Done'&&i.Date>S.today&&m(i)).sort((a,b)=>(a.Date+(a.Time||'')).localeCompare(b.Date+(b.Time||'')));
  if(up.length){const open=q||window.upOpen,lim=q?up.length:10;
    h+=`<h2 data-a="upt" style="cursor:pointer">Coming up (${up.length}) ${q?'':open?'▾':'▸'}</h2>`;
    if(open)h+=up.slice(0,lim).map(i=>rowH(i,i.Date).replace(`<span class="tm">${i.Time||''}</span>`,`<span class="tm">${parseD(i.Date).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'2-digit'})}</span>`)).join('')+(up.length>lim?`<div class="empty">+${up.length-lim} more — search to find them</div>`:'')}
  h+=`<div style="margin-top:22px"><button class="chip" data-a="arch">🗄 Archive…</button></div>`;
  return h}
const cats=()=>(S.config.categories||'').split(',').filter(Boolean);
function vLog(){cat=cat||cats()[0]||'';

  <h2>Or add manually</h2><div class="row"><input id="mm" type="number" inputmode="numeric" placeholder="Minutes" style="flex:1;border:0;background:none"><button class="chip" data-a="man">Add</button></div>
  <h2>Today</h2>`+(ts.map(s=>`<div class="row" data-sid="${s.ID}"><div class="t" data-a="es">${E(s.Category)} <small>${s.Minutes} min${s.Start?' · '+s.Start:''}${s.Notes?' · '+E(s.Notes.slice(0,30)):''}</small></div><button class="mv" data-a="ds">✕</button></div>`).join('')||'<div class="empty">No sessions yet today.</div>');
  const from=addD(t,-(range-1)),rs=S.sessions.filter(s=>s.Date>=from),by={};rs.forEach(s=>by[s.Category]=(by[s.Category]||0)+Number(s.Minutes||0));
  const mx=Math.max(1,...Object.values(by)),tot=Object.values(by).reduce((a,b)=>a+b,0);

function streak(c){const ds=new Set(S.sessions.filter(s=>s.Category===c).map(s=>s.Date));let d=ds.has(S.today)?S.today:addD(S.today,-1),n=0;while(ds.has(d)){n++;d=addD(d,-1)}return n}

function sched(){if(!AS.fn)return;clearTimeout(AS.t);AS.dirty=true;AS.t=setTimeout(()=>{if(AS.fn&&AS.dirty){AS.dirty=false;AS.fn()}},350)}

const IM={};let ES={ids:[],orig:[],added:[],pend:[]};
function shrink(f){return new Promise(res=>{const im=new Image(),r=new FileReader();r.onload=()=>{im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)})}
async function addImgs(files){for(const f of [...files]){if(ES.ids.length+ES.pend.length>=3){toast('Max 3 images per item');break}
  const u=await shrink(f);ES.pend.push(u);drawImgs();
  call('api_uploadImage',()=>[u],id=>{ES.pend=ES.pend.filter(p=>p!==u);if(id){ES.ids.push(id);ES.added.push(id);IM[id]=u;sched()}else toast('Image upload failed');drawImgs()})}}

  b.innerHTML=ES.ids.map(id=>`<span class="th"><img data-a="zoom" src="${IM[id]||''}" alt=""><button data-a="rmi" data-i="${id}">✕</button></span>`).join('')+ES.pend.map(p=>`<span class="th"><img src="${p}" style="opacity:.5" alt=""></span>`).join('');

function doneSheet(){if(ES.pend.length)return toast('Image still uploading…');flush();
  if(ES.id)[...new Set([...ES.orig,...ES.added])].filter(x=>!ES.ids.includes(x)).forEach(x=>call('api_deleteImage',()=>[x]));
  ES={ids:[],orig:[],added:[],pend:[]};close()}
// Back / backdrop tap: leaves the sheet. Pending edits are saved, untouched sheets save nothing.

function status(m){const st=$('#sv_st');if(st)st.textContent=m}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('nav button');if(tb){tab=tb.dataset.tab;render();return}
  if(e.target.id==='qb')return quickAdd();if(e.target.id==='qm')return editSheet();
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='close'){if(e.target===el)cancelSheet();return}
  const id=el.dataset.id||(el.closest('[data-id]')||{dataset:{}}).dataset.id;
  switch(a){
   case'bk':cancelSheet();break;
   case'mxadd':editSheet(null,el.dataset.d);break;
   case'col':{const k=el.dataset.k;COL[k]=!COL[k];try{localStorage.setItem('planner_col',JSON.stringify(COL))}catch(e){}render();break}
   case'tg':toggle(id,tab==='today'&&byId(id)&&byId(id).Date<S.today&&!byId(id).Recurrence?byId(id).Date:day);break;
   case'ed':editSheet(id);break;case'mv':moveSheet(id);break;
   case'dt':move(id,'today');break;
   case'm':close();move(id,el.dataset.to);break;
   case'mdate':dateSheet('Move to date',S.today,v=>move(id,v));break;
   case'mb':{const l=prompt('Board label (free text):');if(l!==null){close();move(id,{board:l.trim()})}break}
   case'sv':saveSheet(id);break;case'rm':close();delSoft(id);break;
   case'pd':day=addD(day,-1);render();break;case'nd':day=addD(day,1);render();break;
   case'pk':dateSheet('Go to date',day,v=>{day=v;render()});break;
   case'sn':{const i=byId(id),[h,m]=i.Time.split(':').map(Number),t=h*60+m+30;save({ID:id,Time:pad(Math.floor(t/60)%24)+':'+pad(t%60)},'Snoozed 30 min');break}

    const z=DR.over;DR.over&&DR.over.classList.remove('dz');DR.over=null;
    const it=byId(DR.id);
    if(z&&it){const to=z.dataset.drop,end=z.dataset.end;
      if(to==='later'){if(it.Type!=='Backlog')move(it.ID,'backlog')}
      else if(!(it.Type==='Planned'&&it.Date>=to&&it.Date<=end))move(it.ID,to)}
    if(DR.again){DR.again=false;render()}}
  DR.el=null;DR.ghost=null}
document.addEventListener('touchstart',drDown,{passive:true});
document.addEventListener('touchmove',drMove,{passive:false});
document.addEventListener('mousedown',drDown);
document.addEventListener('mousemove',drMove);
['touchend','touchcancel','mouseup'].forEach(t=>document.addEventListener(t,drUp));
document.addEventListener('contextmenu',e=>{if(DR.on||(e.target.closest&&e.target.closest('.mc')))e.preventDefault()});
document.addEventListener('click',e=>{if(Date.now()-DR.t<450){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a="mxall"]');if(b){window.mxAll=true;render()}});

/* ---------- boot ---------- */
render();
const SKEL='<div class="sk"></div>'.repeat(5);
function readCache(){try{const c=JSON.parse(localStorage.getItem('planner_v1')||'null');if(c&&Array.isArray(c.items)&&Array.isArray(c.completions)&&Array.isArray(c.sessions))return c}catch(e){}return null}
function load(quiet){if(!quiet){LOAD=SKEL;render()}
  google.script.run.withSuccessHandler(d=>{
    if(pend>0){queue=queue.then(()=>{load(true)});return} // unsaved changes in flight: refetch once they finish
    norm(d);
    const first=!loaded;LOAD='';S=d;loaded=true;if(first)day=S.today;render();saveCache()})
   .withFailureHandler(e=>{if(HAVE){toast('Offline — showing your last saved copy');return}LOAD=`<div class="empty">Couldn't load your data:<br><b>${E(e&&e.message||e)}</b><br><br><button class="pri" data-a="retry">Retry</button></div>`;render()}).api_bootstrap()}
if(hasGS){const c=readCache();if(c){S=norm(c);S.today=fmt(new Date());day=S.today;HAVE=true;render()}load(HAVE)}
else{S.items=[{ID:'a',Title:'Morning walk',Type:'Planned',Date:S.today,Time:'06:30',Recurrence:'daily',Status:'Open',Tags:'fitness'},{ID:'b',Title:'Team call',Type:'Planned',Date:S.today,Time:'23:30',Status:'Open'},{ID:'c',Title:'Pay electricity bill',Type:'Planned',Date:S.today,Status:'Open'},{ID:'d',Title:'Get phone repaired',Type:'Backlog',Status:'Open',Tags:'errands'}];render()}
</script>
<script>
/* Linked apps add-on v3: several apps, called directly from the browser */
(function(){
const PR={Urgent:3,High:2,Medium:1,Low:0};
const LK={items:[],errs:{},t:0,cur:null};
const pinK=k=>'planner_linked_pin_'+k;
const getPin=k=>{if(k==='ke')return 'none';try{return localStorage.getItem(pinK(k))||''}catch(e){return ''}};
const setPin=(k,v)=>{try{localStorage.setItem(pinK(k),v)}catch(e){}};
try{const c=JSON.parse(localStorage.getItem('planner_linked_v3')||'null');if(c&&Array.isArray(c.items))LK.items=c.items}catch(e){}
const keep=()=>{try{localStorage.setItem('planner_linked_v3',JSON.stringify({items:LK.items}))}catch(e){}};
const get=u=>LK.items.find(x=>x.uid===u);
const errTxt=e=>String(e&&e.message||e);
const when=t=>{if(!t)return '';try{return new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(e){return ''}};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

function post(app,fn,args){
  const pin=getPin(app.key);
  if(!pin)return Promise.reject(new Error('NOPIN'));
  return fetch(app.api,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:pin,fn:fn,args:args||[]})})
   .then(r=>r.text()).then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw new Error(app.name+' did not return data. Check its deployment access is Anyone and a New version was deployed.')}
     if(j&&j.error){const m=String(j.error);
       if(m==='AUTH')throw new Error('Wrong '+app.name+' PIN. Tap PINs and enter it again.');
       if(m==='AUTHLOCKED')throw new Error('Too many wrong PINs for '+app.name+'. Try again in 15 minutes.');
       if(m==='AUTHSETUP')throw new Error('Set a PIN in '+app.name+' first.');
       throw new Error(m.replace(/^[\s\S]*?E!/,''))}
     return j?j.r:null})}

/* ---------------- Issues ---------------- */
const ISS_ST=['Backlog','Open','In Progress','Action Needed','WFPA','Done','Cancelled'],ISS_ACT=['Open','In Progress','Action Needed','WFPA'];
function logTxt(e){if(!e)return '';const c=String(e.c||'').slice(0,300);
  switch(e.k){case 'chg':return e.f+': '+(e.o?e.o+' → ':'')+e.n+(c?' — '+c:'');
   case 'note':return c;case 'reply':return 'Reply: '+c;case 'email':return 'Email sent'+(c?': '+c:'');
   case 'mailin':return (e.o?'You wrote: ':'Mail received: ')+c;case 'wa':return 'WhatsApp'+(c?': '+c:'');
   case 'create':return e.a||'Raised';case 'photo':return e.a||'Photo added';
   case 'sheet':return 'Edited in sheet: '+e.f+(e.n?' → '+e.n:'');default:return e.a||c}}
const issOk=i=>ISS_ACT.indexOf(i.st)>=0&&!!i.due&&String(i.cat||'').toLowerCase()!=='reference';
const issMap=i=>({key:'iss',app:'Issues',id:i.id,uid:'iss:'+i.id,title:String(i.d||'').split('\n')[0].slice(0,200),st:i.st,stv:i.st,due:i.due,pri:i.pri||'Medium',
  as:i.as||'',sub:[i.cat,i.g].filter(Boolean).join(' · '),log:(i.log||[]).slice(-8).map(e=>({t:e.t,by:String(e.by||'').split('@')[0],x:logTxt(e)})).filter(e=>e.x)});
const ISS={key:'iss',name:'Issues',
  url:'https://script.google.com/macros/s/AKfycby2SH6GiWfJbDEGS4s-uIxkwnAp9SGnTlid0QuYItAF6LOVxreWnsB_Mos1ecbbYWPkgA/exec',
  api:'https://script.google.com/macros/s/AKfycby2SH6GiWfJbDEGS4s-uIxkwnAp9SGnTlid0QuYItAF6LOVxreWnsB_Mos1ecbbYWPkgA/exec',
  fetch(){return post(this,'api_sync',[-1]).then(r=>((r&&r.issues)||[]).filter(issOk).map(issMap))},
  sts:it=>ISS_ST.map(s=>({v:s,l:s})),
  doneSt:it=>'Done',
  stays:(it,st)=>ISS_ACT.indexOf(st)>=0,
  label:(it,st)=>st,
  update(it,st,c){return post(this,'api_update',[it.id,st?{st:st}:{},c||'',uid(),'']).then(r=>({item:r&&r.issue&&issOk(r.issue)?issMap(r.issue):null}))}};

/* ---------------- KE (Kanban Engine) ---------------- */
const KE_URL='https://script.google.com/macros/s/AKfycbzii72bCTGyR_j_69eANKclU3wxHpGm-c6sb3RPDtZt4yni6RfsTh7lOLVUxfTlnLY8/exec';
const KE={key:'ke',name:'KE',url:KE_URL+'?m=1',api:KE_URL,
  fetch(){return post(this,'PL_dueTasks',[]).then(r=>{
    const out=[];((r&&r.sheets)||[]).forEach(s=>s.tasks.forEach(t=>{
      const lane=s.lanes.find(l=>l.v===t.status);
      out.push({key:'ke',app:'KE',sheet:s.sheet,id:t.id,uid:'ke:'+s.sheet+'|'+t.id,title:t.title,st:lane?lane.l:t.status,stv:t.status,due:t.due,pri:t.priority,
        as:t.assignee,sub:[s.sheet,t.project,t.epic].filter(Boolean).join(' · '),log:(t.comments||[]).map(x=>({t:'',by:'',x:x})),sts:s.lanes})}));
    if(r&&r.errors&&r.errors.length&&!out.length)throw new Error(r.errors.join('; '));
    return out})},
  sts:it=>(it.sts||[]).filter(l=>!/^(archived|deleted)$/i.test(l.v)).map(l=>({v:l.v,l:l.l})),
  doneSt:it=>{const L=(it.sts||[]).filter(l=>l.t==='Done');const d=L.find(l=>/^done$/i.test(l.v))||L.find(l=>!/^(dropped|cancelled)$/i.test(l.v));return d?d.v:''},
  stays:(it,st)=>{const l=(it.sts||[]).find(x=>x.v===st);return !(l&&l.t==='Done')&&!/^(archived|deleted|dropped|cancelled)$/i.test(st)},
  label:(it,st)=>{const l=(it.sts||[]).find(x=>x.v===st);return l?l.l:st},
  update(it,st,c){
    const p=st?post(this,'KE_api_moveTask',[it.sheet,it.id,st,c||'Moved from Planner',{}]):post(this,'KE_api_updateTask',[it.sheet,it.id,{note:c}]);
    return p.then(r=>{if(!r||!r.ok)throw new Error((r&&r.error)||'Save failed');return {}})}};
const APPS={iss:ISS,ke:KE};
const QUICK=[
  ['🙏','https://script.google.com/macros/s/AKfycbzuA34S8vHXlU-LaQHTnVmWNj6gOK8OUZ9Nr4q7O2cvMAf33Amk4_9c058OHZU2fWGZFw/exec'],
  ['🔮','https://script.google.com/macros/s/AKfycbwT7ybTRL__NKnJP0nLhnwiaUV27G3uWNrWlqS6jBMx1VLyloyMbl2AbYsE4hcqGbDw/exec'],
  ['📊','https://script.google.com/macros/s/AKfycbxGYtVcqH69dbJwt-8_zlbbiamkR5a241MqL3qVNQ-WyFOwdOkh5FTmQXSzwMR9ht8N/exec'],
  ['🧘‍♂️ 💪 🎯','https://script.google.com/macros/s/AKfycbymjbLEK6enQdJI0sKB50VReg4sC9cR2eMh8kqX4-Z34jmi4ZVZNTWEWkM89zlGOlR1fQ/exec'],
  ['✅','https://script.google.com/macros/s/AKfycbymhLFQNI75i7mcU0xHQvkAlPDscM25KYXOVkAPkuS2dfw4WLHVnWjrPKGOKLcwrf-XZQ/exec'],
  ['🔒','https://script.google.com/macros/s/AKfycbxCZZ38-3poCaCv6S2R_JeldtasAikVBmRhPHyvPSTOIruR3Q0lGZBiC1pYB85ShWdoBQ/exec'],
  ['📚🧠','https://script.google.com/macros/s/AKfycbwlcs1j97ztSxWY-g6nsSTmcyi3XKYD4OjmjKtqhzKZEGA0Uv_FjakzzUsPKTUddkHi/exec'],
  ['💰','https://script.google.com/macros/s/AKfycbw98KAuHK60juWMxWMvS2BI0R8OUzNIp0T-Yrzv8yuE9eaBQFxSw50aT_iyW6nuIdBpVg/exec'],
  // add a new app = add one line: ['Name','https://link'],
];
function refresh(){if($('#sh').innerHTML||DR.on)return;if(tab==='today'||tab==='plan')render()}
function load(){
  const apps=Object.values(APPS).filter(a=>getPin(a.key));
  if(!apps.length){refresh();return}
  if(typeof pend!=='undefined'&&pend>0){setTimeout(load,1500);return}
  LK.t=Date.now();
  apps.forEach(a=>a.fetch().then(list=>{
    LK.items=LK.items.filter(x=>x.key!==a.key).concat(list);LK.errs[a.key]='';keep();refresh()})
   .catch(e=>{LK.errs[a.key]=errTxt(e);refresh()}))}

function forDay(d){const t=S.today;
  return LK.items.filter(x=>x.due===d||(d===t&&x.due<t))
   .sort((a,b)=>((a.due<t)?0:1)-((b.due<t)?0:1)||a.due.localeCompare(b.due)||(PR[b.pri]||0)-(PR[a.pri]||0))}

function row(it){const od=it.due<S.today;
  return `<div class="row ${od?'od':''}" data-lk="${E(it.uid)}"><button class="ck" data-a="lkdone" aria-label="Mark done"></button>
  <span class="tm" style="min-width:40px;font-size:12px">${E(it.app)}</span>
  <div class="t" data-a="lkopen"><div class="ti">${E(it.title)}</div><small>${E(it.st)}${it.as?' · '+E(it.as):''}${(it.pri==='Urgent'||it.pri==='High')?' · '+E(it.pri):''}${od?' · Due '+E(it.due):''}</small></div>
  <button class="mv" data-a="lkopen" aria-label="Open">⋯</button></div>`}

function tail(){
  const links=Object.values(APPS).map(a=>`<a class="chip" href="${E(a.url)}" target="_blank" rel="noopener">${E(a.name)} ↗</a>`).join('')
  +QUICK.map(([n,u])=>`<a class="chip" href="${E(u)}" target="_blank" rel="noopener">${E(n)} ↗</a>`).join('');
  const none=Object.values(APPS).filter(a=>!getPin(a.key)).map(a=>a.name);
  const errs=Object.values(APPS).filter(a=>getPin(a.key)&&LK.errs[a.key]).map(a=>`<small class="gr" style="text-align:left;color:var(--bad)">⚠ ${E(LK.errs[a.key])}</small>`).join('');
  return `<h2>Linked apps</h2><div class="chips">${links}<button class="chip" data-a="lkrefresh">↻ Refresh</button><button class="chip" data-a="lkpin">🔑 PINs</button></div>`
   +(none.length?`<small class="gr" style="text-align:left">Tap PINs to show tasks from: ${E(none.join(', '))}.</small>`:'')+errs}

const v0=vToday;
vToday=function(){
  let h=v0();const L=forDay(day);
  if(L.length){h=h.replace('<div class="empty">🌤 Nothing planned for this day.</div>','');
    h+=`<h2>From other apps (${L.length})</h2>`+L.map(row).join('')}
  return h+tail()};

const p0=vPlan;
vPlan=function(){
  LK.items.forEach(x=>S.items.push({ID:'lk:'+x.uid,Title:'📌 '+x.title,Type:'Planned',Date:x.due,Status:'Open',Recurrence:'',Tags:'',Created:'',Order:''}));
  let h;try{h=p0()}finally{S.items=S.items.filter(i=>!String(i.ID).startsWith('lk:'))}
  return h.replace(/data-a="ed" data-id="lk:([^"]*)"/g,'data-a="lkopen" data-fixed="1" data-lk="$1"')};

function apply(it,st,c){
  const app=APPS[it.key],prev=it.stv,changed=!!st&&st!==prev;
  if(changed){it.stv=st;it.st=app.label(it,st)}
  if(c)it.log=(it.log||[]).concat({t:new Date().toISOString(),by:'you',x:c});
  if(changed&&!app.stays(it,st))LK.items=LK.items.filter(x=>x!==it);
  keep();render();
  app.update(it,changed?st:'',c).then(res=>{
    if(res&&res.item!==undefined){const ix=LK.items.findIndex(x=>x.uid===it.uid);
      if(res.item===null){if(ix>=0)LK.items.splice(ix,1)}else if(ix>=0)LK.items[ix]=res.item;else LK.items.push(res.item)}
    keep();refresh()})
   .catch(e=>{toast('Not saved to '+app.name+': '+errTxt(e));load()})}
function markDone(k){
  const it=get(k);if(!it)return;const app=APPS[it.key],d=app.doneSt(it);
  if(!d)return toast('No Done status found in '+it.sub);
  const prev=it.stv;apply(it,d,'');
  toast('Marked done in '+it.app,()=>{it.stv=prev;it.st=app.label(it,prev);LK.items.push(it);keep();render();
    app.update(it,prev,'Reopened from Planner').then(res=>{if(res&&res.item){const ix=LK.items.findIndex(x=>x.uid===it.uid);if(ix>=0)LK.items[ix]=res.item}keep();refresh()}).catch(e=>{toast('Undo not saved: '+errTxt(e));load()})})}

function openSheet(k){
  const it=get(k);if(!it)return;const app=APPS[it.key],sts=app.sts(it);
  LK.cur={k,st:it.stv};
  const log=(it.log||[]).slice().reverse();
  sheet(`<div class="top"><button class="bk" data-a="bk" aria-label="Back">‹</button><b>${E(it.app)} · ${E(it.id)}</b><button class="pri" data-a="lksave">Save</button></div>
  <div style="font-weight:600;margin:8px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere">${E(it.title)}</div>
  <small class="gr" style="text-align:left">Due ${E(it.due)}${it.as?' · '+E(it.as):''}${it.pri?' · '+E(it.pri):''}${it.sub?' · '+E(it.sub):''}</small>
  <label>Status</label><div class="chips" id="lkst">${sts.map(s=>`<button class="chip ${s.v===it.stv?'on':''}" data-a="lkst" data-s="${E(s.v)}">${E(s.l)}</button>`).join('')}</div>
  <label>Comment${it.key==='iss'?' <small>(required to cancel)</small>':''}</label><textarea id="lk_c" rows="3" placeholder="Add a remark for the ${E(it.app)} timeline…"></textarea>
  <div class="chips"><a class="chip" href="${E(app.url)}" target="_blank" rel="noopener">Open in ${E(app.name)} ↗</a></div>
  <label>Recent activity</label>${log.map(e=>`<div class="row" style="display:block;padding:8px 10px"><small>${E(e.by||'')}${e.by&&e.t?' · ':''}${E(when(e.t))}</small><div style="white-space:pre-wrap;overflow-wrap:anywhere">${E(e.x)}</div></div>`).join('')||'<div class="empty">No activity yet.</div>'}`)}
function saveSheet2(){
  const c=LK.cur;if(!c)return;const it=get(c.k);if(!it){close();return}
  const txt=($('#lk_c').value||'').trim(),st=c.st;
  if(it.key==='iss'&&st==='Cancelled'&&it.stv!=='Cancelled'&&!txt)return toast('Add a comment explaining the cancellation');
  if(st===it.stv&&!txt)return toast('Nothing changed');
  const prev=it.st,app=APPS[it.key],lbl=app.label(it,st),chg=st!==it.stv;close();apply(it,st,txt);
  toast(chg?(it.app+': '+prev+' \u2192 '+lbl):'Comment saved')}

function pinSheet(){
  sheet(`<div class="top"><button class="bk" data-a="bk" aria-label="Back">‹</button><b>App PINs</b><button class="pri" data-a="lkpinsave">Save</button></div>
  <small class="gr" style="text-align:left">Stored only on this device. Enter once per device. Leave a box empty to keep what is saved.</small>`
  +Object.values(APPS).filter(a=>a.key!=='ke').map(a=>`<label>${E(a.name)} PIN ${getPin(a.key)?'<small>(saved)</small>':''}</label><input id="lk_pin_${a.key}" type="password" autocomplete="off" placeholder="${getPin(a.key)?'Saved. Type to change':'PIN'}" value="">`).join(''))}

document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-a^="lk"]');if(!el)return;
  const a=el.dataset.a,r=el.closest('[data-lk]'),k=el.dataset.lk||(r&&r.dataset.lk);
  if(a==='lkopen'&&k)openSheet(k);
  else if(a==='lkdone'&&k)markDone(k);
  else if(a==='lkst'){if(LK.cur){LK.cur.st=el.dataset.s;document.querySelectorAll('#lkst .chip').forEach(b=>b.classList.toggle('on',b===el))}}
  else if(a==='lksave')saveSheet2();
  else if(a==='lkpin')pinSheet();
  else if(a==='lkpinsave'){let n=0;Object.values(APPS).forEach(ap=>{const v=(($('#lk_pin_'+ap.key)||{}).value||'').trim();if(v){setPin(ap.key,v);LK.errs[ap.key]='';n++}});
    close();if(n){toast('Connecting…');load()}}
  else if(a==='lkrefresh'){load();toast(Object.values(APPS).some(x=>getPin(x.key))?'Refreshing…':'Set a PIN first')}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-LK.t>60000)load()});
// move the PIN you already saved for Issues (older version) to the new place
try{const o=localStorage.getItem('planner_linked_pin_iss');if(o&&!getPin('iss'))setPin('iss',o)}catch(e){}
load();
})();
</script>
